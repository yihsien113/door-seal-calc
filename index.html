<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 加入完整 Viewport 設定，防止手機自動微縮 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>氣密條長度計算工具</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            padding: 15px;
            margin: 0;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-top: 10px;
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        
        /* 通用按鈕觸控優化 */
        button {
            touch-action: manipulation; /* 消除手機點擊 300ms 延遲與畫面誤放大 */
            transition: background-color 0.2s, transform 0.1s;
        }
        button:active {
            transform: translateY(1px); /* 觸控時的回饋按壓感 */
        }

        .btn-add {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
        }
        .btn-add:hover {
            background-color: #219150;
        }
        .row {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            background-color: #f9f9f9;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 120px;
        }
        .input-row {
            display: flex;
            gap: 5px;
        }
        label {
            font-size: 14px;
            margin-bottom: 6px;
            color: #555;
            font-weight: bold;
        }
        input[type="number"], select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px; /* 16px 防止 iOS Safari 點擊輸入框時畫面自動放大 */
            background-color: #fff;
            color: #333;
            width: 100%;
            box-sizing: border-box;
            touch-action: manipulation;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }
        
        /* 隱藏 input type="number" 的上下箭頭 */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        .qty-input {
            text-align: center;
        }

        /* 單位選取後的動態背景與輸入框同步樣式 */
        .unit-select-cm {
            background-color: #ffffff !important; /* CM：白底 */
            color: #333333 !important;
            font-weight: bold;
            border-color: #ccc !important;
        }
        .unit-select-taiwan {
            background-color: #bcbcbc !important; /* 台尺：加深灰色底 */
            color: #000000 !important;            /* 純黑字提高可讀性 */
            font-weight: bold;
            border-color: #888888 !important;
        }

        .btn-remove {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            height: 42px; /* 與輸入框對齊高度 */
            white-space: nowrap;
        }
        .btn-remove:hover {
            background-color: #c0392b;
        }
        .btn-calc {
            background-color: #2980b9;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 18px;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
        }
        .btn-calc:hover {
            background-color: #1f6391;
        }
        #result-area {
            margin-top: 20px;
            padding: 15px;
            background-color: #e8f4f8;
            border: 1px solid #bce8f1;
            border-radius: 6px;
            font-size: 20px;
            font-weight: bold;
            display: none; 
            text-align: center;
        }

        /* 📱 手機版專屬 RWD 自適應視覺 (螢幕寬度 600px 以下) */
        @media (max-width: 600px) {
            body {
                padding: 8px;
            }
            .container {
                padding: 15px 12px;
            }
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            .btn-add {
                width: 100%;
                text-align: center;
            }
            .row {
                display: grid;
                grid-template-columns: 1fr 1fr; /* 切換為兩欄直向網格 */
                gap: 10px;
                padding: 12px;
            }
            .input-group {
                min-width: 0;
            }
            .input-group:nth-child(1) { grid-column: span 2; } /* 門框規格佔滿橫行 */
            .input-group:nth-child(2) { grid-column: span 1; } /* 高度 x 2 */
            .input-group:nth-child(3) { grid-column: span 1; } /* 寬度 x 1 */
            .input-group:nth-child(4) { grid-column: span 1; } /* 數量 */
            
            .btn-remove {
                grid-column: span 1;
                width: 100%;
                margin-top: 22px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>氣密條長度計算工具</h2>
    
    <div class="controls">
        <span>請輸入各尺寸門框的高寬與數量（選台尺時請填台分）：</span>
        <button class="btn-add" onclick="addRow()">+ 新增尺寸</button>
    </div>

    <div id="input-container">
        <!-- 輸入列會透過 JavaScript 動態產生 -->
    </div>

    <button class="btn-calc" onclick="calculate()">計算總長度</button>

    <div id="result-area">
        總共需要氣密條長度： <span id="total-length" style="color: #27ae60;">0</span> 尺
    </div>
</div>

<script>
    window.onload = function() {
        addRow();
    };

    function updateUnitStyle(selectElement) {
        const inputRow = selectElement.parentElement;
        const textInput = inputRow.querySelector('input[type="number"]');

        if (selectElement.value === 'cm') {
            // CM：下拉選單與數字輸入框皆改為白底
            selectElement.classList.add('unit-select-cm');
            selectElement.classList.remove('unit-select-taiwan');
            if (textInput) {
                textInput.classList.add('unit-select-cm');
                textInput.classList.remove('unit-select-taiwan');
            }
        } else {
            // 台尺：下拉選單與數字輸入框皆改為深灰底
            selectElement.classList.add('unit-select-taiwan');
            selectElement.classList.remove('unit-select-cm');
            if (textInput) {
                textInput.classList.add('unit-select-taiwan');
                textInput.classList.remove('unit-select-cm');
            }
        }
    }

    function addRow() {
        const container = document.getElementById('input-container');
        const row = document.createElement('div');
        row.className = 'row';

        row.innerHTML = `
            <div class="input-group">
                <label>門框規格</label>
                <select class="spec-select">
                    <option value="8.5">8.5cm</option>
                    <option value="10">10cm</option>
                    <option value="11.5">11.5cm</option>
                    <option value="13.5">13.5cm</option>
                    <option value="14.5">14.5cm</option>
                    <option value="15.5">15.5cm</option>
                </select>
            </div>
            <div class="input-group">
                <label>高度 x 2</label>
                <div class="input-row">
                    <input type="number" step="1" class="height-input unit-select-cm" placeholder="高">
                    <select class="height-unit unit-select-cm" onchange="updateUnitStyle(this)">
                        <option value="cm">CM</option>
                        <option value="taiwan-foot">台尺</option>
                    </select>
                </div>
            </div>
            <div class="input-group">
                <label>寬度 x 1</label>
                <div class="input-row">
                    <input type="number" step="1" class="width-input unit-select-cm" placeholder="寬">
                    <select class="width-unit unit-select-cm" onchange="updateUnitStyle(this)">
                        <option value="cm">CM</option>
                        <option value="taiwan-foot">台尺</option>
                    </select>
                </div>
            </div>
            <div class="input-group">
                <label>門框數量 (樘)</label>
                <input type="number" class="qty-input" value="1" placeholder="數量">
            </div>
            <button class="btn-remove" onclick="removeRow(this)">刪減</button>
        `;
        
        container.appendChild(row);
    }

    function removeRow(button) {
        const container = document.getElementById('input-container');
        if (container.children.length > 1) {
            button.parentElement.remove();
        } else {
            alert('這是最後一組，無法刪除喔！');
        }
    }

    function calculate() {
        const rows = document.querySelectorAll('.row');
        let totalCm = 0;
        let hasError = false;

        rows.forEach((row) => {
            const spec = parseFloat(row.querySelector('.spec-select').value);
            let rawWidth = parseFloat(row.querySelector('.width-input').value);
            const widthUnit = row.querySelector('.width-unit').value;
            let rawHeight = parseFloat(row.querySelector('.height-input').value);
            const heightUnit = row.querySelector('.height-unit').value;
            const qty = parseInt(row.querySelector('.qty-input').value) || 0;

            if (isNaN(rawWidth) || isNaN(rawHeight) || rawWidth <= 0 || rawHeight <= 0) {
                hasError = true;
                return;
            }

            let widthCm = 0;
            let heightCm = 0;

            if (widthUnit === 'taiwan-foot') {
                widthCm = rawWidth / 3.3;
            } else {
                widthCm = rawWidth;
            }

            if (heightUnit === 'taiwan-foot') {
                heightCm = rawHeight / 3.3;
            } else {
                heightCm = rawHeight;
            }

            let thickness = 0;
            if (spec === 8.5) {
                thickness = 2.1;
            } else if (spec === 10 || spec === 11.5 || spec === 13.5) {
                thickness = 2.4;
            } else if (spec === 14.5 || spec === 15.5) {
                thickness = 2.7;
            }

            const netWidth = widthCm - (thickness * 2);
            const netHeight = heightCm - thickness;
            const singleFrameCm = (netHeight * 2) + netWidth;

            totalCm += singleFrameCm * qty;
        });

        if (hasError) {
            alert('請確認所有尺寸數值皆已完整輸入！');
            return;
        }

        // 精確轉為台尺 (* 0.033)
        const totalFeet = totalCm * 0.033;
        const resultArea = document.getElementById('result-area');
        const totalLengthSpan = document.getElementById('total-length');
        
        totalLengthSpan.innerText = totalFeet.toFixed(2);
        resultArea.style.display = 'block';
    }
</script>

</body>
</html>
